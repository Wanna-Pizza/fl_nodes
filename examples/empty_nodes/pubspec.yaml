name: empty_nodes
description: Minimal example showing only nodes, fields and a context menu
publish_to: none

environment:
  sdk: ">=2.17.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  fl_nodes:
    path: ../../packages/fl_nodes

# Use local packages from the monorepo for development
dependency_overrides:
  fl_nodes_core:
    path: ../../packages/fl_nodes_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  generate: true
  shaders:
    - packages/fl_nodes_core/shaders/grid.frag
